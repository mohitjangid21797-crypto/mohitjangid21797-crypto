<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0b3d91"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>

  <!-- accent bar -->
  <rect x="0" y="0" width="8" height="300" fill="url(#accent)"/>

  <!-- decorative code brackets -->
  <text x="1050" y="190" font-family="Consolas, Monaco, monospace" font-size="150" fill="#38bdf8" fill-opacity="0.12" font-weight="bold">&lt;/&gt;</text>

  <!-- name -->
  <text x="70" y="130" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="56" font-weight="700" fill="#f8fafc">
    Mohit Suthar
  </text>

  <!-- accent underline -->
  <rect x="72" y="150" width="230" height="5" rx="2.5" fill="url(#accent)"/>

  <!-- tagline -->
  <text x="70" y="195" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#94a3b8">
    B.Tech CSE Student · Flutter Developer · DSA &amp; Data Analytics
  </text>

  <!-- tech tags -->
  <g font-family="Consolas, Monaco, monospace" font-size="16" fill="#38bdf8">
    <rect x="70" y="220" width="90" height="32" rx="16" fill="#0ea5e9" fill-opacity="0.15"/>
    <text x="88" y="241">C++</text>

    <rect x="172" y="220" width="100" height="32" rx="16" fill="#0ea5e9" fill-opacity="0.15"/>
    <text x="190" y="241">Flutter</text>

    <rect x="284" y="220" width="100" height="32" rx="16" fill="#0ea5e9" fill-opacity="0.15"/>
    <text x="302" y="241">Python</text>

    <rect x="396" y="220" width="90" height="32" rx="16" fill="#0ea5e9" fill-opacity="0.15"/>
    <text x="414" y="241">Java</text>
  </g>
</svg>
