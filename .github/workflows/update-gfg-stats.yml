name: Update GFG Stats Card

on:
  schedule:
    # Runs every day at 00:30 UTC (~6:00 AM IST). Adjust as you like.
    - cron: "30 0 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

jobs:
  update-card:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate GFG stats card
        run: node scripts/generate-gfg-card.mjs mohitjangid108

      - name: Commit updated card if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gfg-profile-card.svg
          git diff --cached --quiet || git commit -m "chore: update GFG stats card"
          git push
