name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *" # Runs every midnight
  workflow_dispatch: # Allows you to run it manually

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: mohitjangid21797-crypto
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=#4caf50&color_dots=#ffffff,#c8e6c9,#81c784,#4caf50,#1b5e20
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#4caf50&color_dots=#161b22,#c8e6c9,#81c784,#4caf50,#1b5e20

      - name: Push to Output Branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
